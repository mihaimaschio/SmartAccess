<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartAccess — Access History</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <div class="page-header">
        <div>
          <h2>Access History</h2>
          <p class="header-subtitle">All access events</p>
        </div>
        <div style="display:flex; gap:8px;">
          <select id="filter-result" class="form-input" style="width:auto; padding:8px 12px; font-size:12px;" onchange="loadHistory()">
            <option value="">All</option>
            <option value="granted">Granted</option>
            <option value="denied">Denied</option>
          </select>
        </div>
      </div>

      <div class="card">
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Status</th>
                <th>User</th>
                <th>Access Type</th>
                <th>Details</th>
                <th>Date &amp; Time</th>
              </tr>
            </thead>
            <tbody id="history-body">
              <tr><td colspan="5" style="text-align:center; padding:40px;">
                <div class="spinner" style="margin:0 auto;"></div>
                <p style="margin-top:12px; color:var(--text-muted);">Loading...</p>
              </td></tr>
            </tbody>
          </table>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:16px;">
          <span id="history-info" style="font-size:12px; color:var(--text-muted);"></span>
          <div style="display:flex; gap:6px;">
            <button class="btn btn-ghost" id="btn-prev" onclick="prevPage()" disabled>← Previous</button>
            <button class="btn btn-ghost" id="btn-next" onclick="nextPage()">Next →</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script>
    if (!requireAuth()) throw 'Not logged in';
    initSidebar('history');

    let currentPage = 0;
    const pageSize = 20;
    let totalRecords = 0;

    async function loadHistory() {
      const filterResult = document.getElementById('filter-result').value;
      const offset = currentPage * pageSize;

      let url = `/access-log?limit=${pageSize}&offset=${offset}`;
      if (filterResult) url += `&result=${filterResult}`;

      try {
        const data = await api.get(url);
        totalRecords = data.total;
        const tbody = document.getElementById('history-body');

        if (data.logs.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5"><div class="empty-state"><h3>No records</h3></div></td></tr>';
        } else {
          tbody.innerHTML = data.logs.map(log => {
            const typeMap = { fingerprint: 'Fingerprint', pin: 'PIN', app_unlock: 'App', unknown: 'Unknown' };
            const date = new Date(log.created_at);
            const dateStr = date.toLocaleDateString('en-GB', { day:'2-digit', month:'2-digit', year:'numeric' });
            const timeStr = date.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', second:'2-digit' });

            return `<tr>
              <td><span class="badge ${log.result === 'granted' ? 'badge-success' : 'badge-danger'}">${log.result === 'granted' ? 'Granted' : 'Denied'}</span></td>
              <td style="font-weight:600;">${log.user_name || '<span style="color:var(--text-dim);">Unknown</span>'}</td>
              <td>${typeMap[log.access_type] || log.access_type}</td>
              <td style="color:var(--text-muted); font-size:12px;">${log.details || '—'}</td>
              <td style="white-space:nowrap; font-size:12px;">${dateStr} <span style="color:var(--text-dim);">${timeStr}</span></td>
            </tr>`;
          }).join('');
        }

        const start = offset + 1;
        const end = Math.min(offset + data.logs.length, totalRecords);
        document.getElementById('history-info').textContent = totalRecords > 0 ? `${start}-${end} of ${totalRecords}` : '';
        document.getElementById('btn-prev').disabled = currentPage === 0;
        document.getElementById('btn-next').disabled = end >= totalRecords;
      } catch (e) {
        showToast(e.message, 'error');
      }
    }

    function prevPage() { if (currentPage > 0) { currentPage--; loadHistory(); } }
    function nextPage() { currentPage++; loadHistory(); }

    loadHistory();
    setInterval(loadHistory, 5000);
  </script>
</body>
</html>
