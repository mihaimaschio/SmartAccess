<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartAccess — Activate Account</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <h1>SMART ACCESS</h1>
      </div>

      <div id="state-loading" style="text-align:center; padding:24px 0;">
        <div class="spinner" style="margin:0 auto 12px;"></div>
        <p style="font-size:13px; color:var(--text-muted);">Verifying invitation...</p>
      </div>

      <div id="state-error" style="display:none; text-align:center; padding:16px 0;">
        <div style="width:48px; height:48px; border-radius:50%; background:var(--danger-bg); display:flex; align-items:center; justify-content:center; margin:0 auto 16px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </div>
        <p style="font-size:14px; font-weight:600; color:var(--danger);" id="error-msg">Invalid or expired link.</p>
        <p style="font-size:12px; color:var(--text-muted); margin-top:8px;">Request a new link from the administrator.</p>
        <a href="/index.html" style="display:inline-block; margin-top:16px; font-size:13px; color:var(--accent);">Back to login</a>
      </div>

      <div id="state-form" style="display:none;">
        <p style="font-size:13px; color:var(--text-muted); margin-bottom:20px; text-align:center;">
          You have been invited to SmartAccess. Set your password to activate your account.
        </p>

        <div class="form-group">
          <label class="form-label">Name</label>
          <input type="text" id="f-name" class="form-input" readonly style="opacity:0.6; cursor:default;">
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="f-email" class="form-input" readonly style="opacity:0.6; cursor:default;">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="f-password" class="form-input" placeholder="Minimum 4 characters" autofocus>
        </div>
        <div class="form-group">
          <label class="form-label">Confirm password</label>
          <input type="password" id="f-password2" class="form-input" placeholder="Repeat password">
        </div>

        <div id="reg-error" class="login-error"></div>

        <button class="btn btn-primary" id="btn-register" style="width:100%; justify-content:center; padding:14px; margin-top:8px;" onclick="doRegister()">
          ACTIVATE ACCOUNT
        </button>
      </div>

      <div id="state-success" style="display:none; text-align:center; padding:16px 0;">
        <div style="width:56px; height:56px; border-radius:50%; background:var(--success-bg); display:flex; align-items:center; justify-content:center; margin:0 auto 16px;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <p style="font-size:15px; font-weight:700; color:var(--text-primary);">Account activated!</p>
        <p style="font-size:13px; color:var(--text-muted); margin-top:8px;">Redirecting to dashboard...</p>
      </div>

      <p style="text-align:center; margin-top:24px; font-size:11px; color:var(--text-dim);">
        SmartAccess · Home Security
      </p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');

    if (isLoggedIn() && !token) window.location.href = '/dashboard.html';

    function showState(id) {
      ['state-loading','state-error','state-form','state-success'].forEach(s => {
        document.getElementById(s).style.display = s === id ? '' : 'none';
      });
    }

    async function init() {
      if (!token) {
        document.getElementById('error-msg').textContent = 'Link missing. Use the link you received by email.';
        showState('state-error');
        return;
      }
      try {
        const data = await fetch(`/api/auth/invite/${token}`).then(r => r.json());
        if (data.error) throw new Error(data.error);
        document.getElementById('f-name').value = data.full_name;
        document.getElementById('f-email').value = data.email;
        showState('state-form');
      } catch (err) {
        document.getElementById('error-msg').textContent = err.message;
        showState('state-error');
      }
    }

    async function doRegister() {
      const password = document.getElementById('f-password').value;
      const password2 = document.getElementById('f-password2').value;
      const errEl = document.getElementById('reg-error');
      errEl.style.display = 'none';

      if (password.length < 4) {
        errEl.textContent = 'Password must be at least 4 characters.';
        errEl.style.display = 'block';
        return;
      }
      if (password !== password2) {
        errEl.textContent = 'Passwords do not match.';
        errEl.style.display = 'block';
        return;
      }

      const btn = document.getElementById('btn-register');
      btn.disabled = true;
      btn.textContent = 'Processing...';

      try {
        const res = await fetch('/api/auth/register-from-invite', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        saveAuth(data.token, data.user);
        showState('state-success');
        setTimeout(() => { window.location.href = '/dashboard.html'; }, 1500);
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'ACTIVATE ACCOUNT';
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') doRegister();
    });

    init();
  </script>
</body>
</html>
